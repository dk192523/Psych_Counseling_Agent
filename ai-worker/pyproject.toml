[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dk-ai-worker"
version = "0.1.0"
description = "Optional Python intelligence plane for the psychological counseling agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.140",
  "httpx>=0.27,<0.29",
  "jieba>=0.42,<1",
  "pydantic-settings>=2.6,<3",
  "rank-bm25>=0.2,<1",
  "uvicorn[standard]>=0.30,<0.52",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dk_ai_worker"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
