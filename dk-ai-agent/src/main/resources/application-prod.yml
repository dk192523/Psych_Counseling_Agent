# 生产环境配置（覆盖 application.yml）。注意提交时不要包含敏感信息。
#
# API 文档生产收口（双重纵深防御，缺一不可）：
#  1) springdoc api-docs/swagger-ui enabled=false —— /v3/api-docs（含分组端点）与 /swagger-ui/**
#     端点本身不再注册，permitAll 白名单无对象可放行；
#  2) knife4j.production=true —— knife4j 生产防护拦截 doc.html 及文档资源访问；
#  3) app.docs.enabled=false —— SecurityConfig 将四个文档路径移出 permitAll，
#     即便有人重新启用 springdoc，安全链仍拦截未认证访问。
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
knife4j:
  production: true
server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
  # 保留 socket 来源供认证校验代理链，禁止框架预先信任任意 Forwarded/XFF。
  forward-headers-strategy: none
app:
  auth:
    # 逗号分隔的精确代理 IP，从后端最近一跳到公网边缘均须列入；留空时忽略 XFF，
    # 所有来自同一反代的请求安全共享来源预算。不要配置不受控的私网整段。
    trusted-proxy-addresses: ${AUTH_TRUSTED_PROXY_ADDRESSES:}
    limits:
      max-source-keys: ${AUTH_MAX_SOURCE_KEYS:4096}
      source-logins-per-minute: ${AUTH_SOURCE_LOGINS_PER_MINUTE:30}
      global-logins-per-minute: ${AUTH_GLOBAL_LOGINS_PER_MINUTE:120}
      bcrypt-per-minute: ${AUTH_BCRYPT_PER_MINUTE:120}
      bcrypt-concurrency: ${AUTH_BCRYPT_CONCURRENCY:4}
  deployment:
    # main 在 Spring 启动前校验环境变量；合并 YAML/命令行后、Bean 初始化前再次复核。
    # 仅允许单副本，禁止重叠滚动发布；instance-id 仅用于启动观测，不是分布式锁。
    mode: ${APP_DEPLOYMENT_MODE:single}
    replica-count: ${APP_REPLICA_COUNT:1}
    instance-id: ${APP_INSTANCE_ID:}
  data-retention:
    # No automatic business-data deletion until an explicit retention period and apply are set.
    apply: ${DATA_RETENTION_APPLY:false}
    conversation-days: ${DATA_RETENTION_CONVERSATION_DAYS:0}
    batch-size: ${DATA_RETENTION_BATCH_SIZE:100}
  chat-history:
    replay-retention: ${CHAT_HISTORY_REPLAY_RETENTION:7d}
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:false}
  docs:
    enabled: false
